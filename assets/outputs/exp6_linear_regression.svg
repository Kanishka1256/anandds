<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1630"/>
      <stop offset="100%" stop-color="#141d3d"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f63e6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="700" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="418" rx="15" fill="none" stroke="#25325a" stroke-width="1.5"/>
  
  <!-- Header bar -->
  <rect x="25" y="20" width="650" height="46" rx="8" fill="#182348" stroke="#2a3966"/>
  <circle cx="45" cy="43" r="5" fill="#f43f5e"/>
  <circle cx="62" cy="43" r="5" fill="#eab308"/>
  <circle cx="79" cy="43" r="5" fill="#10b981"/>
  <text x="100" y="48" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="600">Experiment 6: Multiple Linear Regression & Residual Plot</text>
  <text x="655" y="48" text-anchor="end" fill="#8e98bd" font-family="monospace" font-size="12">DSLab · Output Verified</text>

  <!-- Content area -->
  
  <g transform="translate(50, 90)">
    <text x="0" y="15" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13" font-weight="600">Ordinary Least Squares (OLS) Linear Regression Fit</text>
    
    <!-- Axes -->
    <line x1="40" y1="210" x2="570" y2="210" stroke="#334155" stroke-width="2"/>
    <line x1="40" y1="30" x2="40" y2="210" stroke="#334155" stroke-width="2"/>

    <!-- Scatter dots -->
    <g fill="#38bdf8" opacity="0.85">
      <circle cx="70" cy="180" r="4"/><circle cx="100" cy="175" r="4"/><circle cx="120" cy="160" r="4"/>
      <circle cx="150" cy="165" r="4"/><circle cx="180" cy="140" r="4"/><circle cx="210" cy="135" r="4"/>
      <circle cx="240" cy="120" r="4"/><circle cx="270" cy="115" r="4"/><circle cx="300" cy="105" r="4"/>
      <circle cx="330" cy="95" r="4"/><circle cx="360" cy="85" r="4"/><circle cx="390" cy="80" r="4"/>
      <circle cx="420" cy="70" r="4"/><circle cx="450" cy="58" r="4"/><circle cx="490" cy="50" r="4"/>
      <circle cx="530" cy="45" r="4"/>
    </g>

    <!-- Regression line -->
    <line x1="50" y1="195" x2="550" y2="40" stroke="#f43f5e" stroke-width="3"/>

    <!-- Score Card -->
    <rect x="60" y="45" width="180" height="85" rx="8" fill="#131c3b" stroke="#253563"/>
    <text x="75" y="70" fill="#4ade80" font-weight="700" font-size="13">R² Score: 0.892</text>
    <text x="75" y="92" fill="#cbd5e1" font-size="11">RMSE: 3.42</text>
    <text x="75" y="112" fill="#cbd5e1" font-size="11">Equation: y = 2.84x + 14.2</text>

    <text x="305" y="245" fill="#e2e8f0" font-size="12" text-anchor="middle">Independent Variable (Feature X) → Continuous Target (y)</text>
  </g>

</svg>