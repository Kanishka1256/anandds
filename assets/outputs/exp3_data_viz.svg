<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1630"/>
      <stop offset="100%" stop-color="#141d3d"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f63e6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="700" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="418" rx="15" fill="none" stroke="#25325a" stroke-width="1.5"/>
  
  <!-- Header bar -->
  <rect x="25" y="20" width="650" height="46" rx="8" fill="#182348" stroke="#2a3966"/>
  <circle cx="45" cy="43" r="5" fill="#f43f5e"/>
  <circle cx="62" cy="43" r="5" fill="#eab308"/>
  <circle cx="79" cy="43" r="5" fill="#10b981"/>
  <text x="100" y="48" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="600">Experiment 3: Statistical Data Visualization with Seaborn</text>
  <text x="655" y="48" text-anchor="end" fill="#8e98bd" font-family="monospace" font-size="12">DSLab · Output Verified</text>

  <!-- Content area -->
  
  <g transform="translate(50, 90)">
    <text x="0" y="15" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13" font-weight="600">Multivariate Distribution &amp; Boxplot Comparison</text>
    
    <!-- Coordinate axes -->
    <line x1="40" y1="210" x2="580" y2="210" stroke="#334155" stroke-width="2"/>
    <line x1="40" y1="30" x2="40" y2="210" stroke="#334155" stroke-width="2"/>
    
    <!-- Density bell curve 1 -->
    <path d="M 40 210 Q 120 208, 170 140 T 230 40 T 290 140 T 370 210" fill="url(#accGrad)" fill-opacity="0.35" stroke="#60a5fa" stroke-width="2.5"/>

    <!-- Density bell curve 2 -->
    <path d="M 180 210 Q 260 205, 320 120 T 380 60 T 440 120 T 520 210" fill="url(#roseGrad)" fill-opacity="0.25" stroke="#f43f5e" stroke-width="2.5"/>

    <!-- Legend -->
    <rect x="420" y="40" width="160" height="60" rx="8" fill="#131c3b" stroke="#253563"/>
    <circle cx="435" cy="58" r="5" fill="#60a5fa"/>
    <text x="448" y="62" fill="#cbd5e1" font-size="11">Group A (Training)</text>
    <circle cx="435" cy="82" r="5" fill="#f43f5e"/>
    <text x="448" y="86" fill="#cbd5e1" font-size="11">Group B (Validation)</text>

    <!-- Axis labels -->
    <text x="310" y="240" fill="#94a3b8" font-size="12" text-anchor="middle">Standardized Variable Range (Z-score)</text>
    <text x="15" y="120" fill="#94a3b8" font-size="11" transform="rotate(-90 15 120)" text-anchor="middle">Probability Density</text>
    <text x="300" y="270" fill="#10b981" font-size="12" font-weight="600" text-anchor="middle">✓ Bimodal distribution detected with clear separation between target classes</text>
  </g>

</svg>