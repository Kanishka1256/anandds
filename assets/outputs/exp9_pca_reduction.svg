<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1630"/>
      <stop offset="100%" stop-color="#141d3d"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f63e6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="700" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="418" rx="15" fill="none" stroke="#25325a" stroke-width="1.5"/>
  
  <!-- Header bar -->
  <rect x="25" y="20" width="650" height="46" rx="8" fill="#182348" stroke="#2a3966"/>
  <circle cx="45" cy="43" r="5" fill="#f43f5e"/>
  <circle cx="62" cy="43" r="5" fill="#eab308"/>
  <circle cx="79" cy="43" r="5" fill="#10b981"/>
  <text x="100" y="48" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="600">Experiment 9: Principal Component Analysis (PCA) Variance Plot</text>
  <text x="655" y="48" text-anchor="end" fill="#8e98bd" font-family="monospace" font-size="12">DSLab · Output Verified</text>

  <!-- Content area -->
  
  <g transform="translate(50, 90)">
    <text x="0" y="15" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13" font-weight="600">Principal Component Analysis: 16 Features → 2 Principal Components</text>
    
    <!-- Scree Plot on Left -->
    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="260" height="175" rx="8" fill="#131c3b" stroke="#253563"/>
      <text x="130" y="22" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">Explained Variance Ratio (Scree)</text>
      <!-- Bars -->
      <rect x="25" y="50" width="30" height="100" rx="3" fill="#3b82f6"/>
      <text x="40" y="45" fill="#60a5fa" font-size="10" text-anchor="middle">58%</text>
      <text x="40" y="165" fill="#94a3b8" font-size="9" text-anchor="middle">PC1</text>

      <rect x="75" y="85" width="30" height="65" rx="3" fill="#38bdf8"/>
      <text x="90" y="80" fill="#38bdf8" font-size="10" text-anchor="middle">24%</text>
      <text x="90" y="165" fill="#94a3b8" font-size="9" text-anchor="middle">PC2</text>

      <rect x="125" y="125" width="30" height="25" rx="3" fill="#64748b"/>
      <text x="140" y="120" fill="#94a3b8" font-size="10" text-anchor="middle">8%</text>
      <text x="140" y="165" fill="#94a3b8" font-size="9" text-anchor="middle">PC3</text>

      <rect x="175" y="138" width="30" height="12" rx="3" fill="#475569"/>
      <text x="190" y="133" fill="#94a3b8" font-size="10" text-anchor="middle">4%</text>
      <text x="190" y="165" fill="#94a3b8" font-size="9" text-anchor="middle">PC4</text>

      <text x="25" y="172" fill="#10b981" font-size="10" font-weight="600">PC1+PC2 = 82% Variance</text>
    </g>

    <!-- 2D Projection on Right -->
    <g transform="translate(300, 35)">
      <rect x="0" y="0" width="280" height="175" rx="8" fill="#131c3b" stroke="#253563"/>
      <text x="140" y="22" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle">2D Projection (PC1 vs PC2)</text>
      <line x1="20" y1="95" x2="260" y2="95" stroke="#334155" stroke-dasharray="2,2"/>
      <line x1="140" y1="35" x2="140" y2="160" stroke="#334155" stroke-dasharray="2,2"/>
      <!-- Group 1 -->
      <circle cx="80" cy="70" r="4" fill="#f43f5e"/><circle cx="95" cy="85" r="4" fill="#f43f5e"/><circle cx="70" cy="90" r="4" fill="#f43f5e"/><circle cx="105" cy="60" r="4" fill="#f43f5e"/>
      <!-- Group 2 -->
      <circle cx="190" cy="120" r="4" fill="#10b981"/><circle cx="210" cy="135" r="4" fill="#10b981"/><circle cx="180" cy="140" r="4" fill="#10b981"/><circle cx="225" cy="115" r="4" fill="#10b981"/>
    </g>
    <text x="290" y="245" fill="#e2e8f0" font-size="12" text-anchor="middle">✓ Retained 82% informational variance while eliminating 14 redundant dimensions</text>
  </g>

</svg>