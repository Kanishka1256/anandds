<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1630"/>
      <stop offset="100%" stop-color="#141d3d"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f63e6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="700" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="418" rx="15" fill="none" stroke="#25325a" stroke-width="1.5"/>
  
  <!-- Header bar -->
  <rect x="25" y="20" width="650" height="46" rx="8" fill="#182348" stroke="#2a3966"/>
  <circle cx="45" cy="43" r="5" fill="#f43f5e"/>
  <circle cx="62" cy="43" r="5" fill="#eab308"/>
  <circle cx="79" cy="43" r="5" fill="#10b981"/>
  <text x="100" y="48" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="600">Experiment 1: Data Preprocessing & Cleaning Matrix</text>
  <text x="655" y="48" text-anchor="end" fill="#8e98bd" font-family="monospace" font-size="12">DSLab · Output Verified</text>

  <!-- Content area -->
  
  <g transform="translate(45, 90)">
    <text x="0" y="20" fill="#93c5fd" font-family="Inter, sans-serif" font-size="14" font-weight="600">Dataset Shape: (10,000, 14) → Missing Values Cleaned &amp; Imputed</text>
    
    <!-- Bar 1: Missing values before -->
    <text x="0" y="60" fill="#8e98bd" font-size="12" font-family="sans-serif">Age (NaN: 840)</text>
    <rect x="140" y="48" width="450" height="16" rx="4" fill="#1e293b"/>
    <rect x="140" y="48" width="378" height="16" rx="4" fill="#ef4444"/>
    <text x="600" y="61" fill="#f87171" font-size="11" font-family="monospace">8.4% (Median Filled)</text>

    <!-- Bar 2: Salary -->
    <text x="0" y="95" fill="#8e98bd" font-size="12" font-family="sans-serif">Salary (NaN: 520)</text>
    <rect x="140" y="83" width="450" height="16" rx="4" fill="#1e293b"/>
    <rect x="140" y="83" width="234" height="16" rx="4" fill="#f59e0b"/>
    <text x="600" y="96" fill="#fbbf24" font-size="11" font-family="monospace">5.2% (KNN Imputed)</text>

    <!-- Bar 3: Duplicates -->
    <text x="0" y="130" fill="#8e98bd" font-size="12" font-family="sans-serif">Duplicates (214)</text>
    <rect x="140" y="118" width="450" height="16" rx="4" fill="#1e293b"/>
    <rect x="140" y="118" width="96" height="16" rx="4" fill="#38bdf8"/>
    <text x="600" y="131" fill="#38bdf8" font-size="11" font-family="monospace">Dropped (100% Valid)</text>

    <!-- Summary Box -->
    <rect x="0" y="160" width="610" height="110" rx="10" fill="#131c3b" stroke="#253563"/>
    <text x="20" y="190" fill="#10b981" font-size="13" font-weight="700">✓ Execution Log Summary:</text>
    <text x="20" y="215" fill="#cbd5e1" font-size="12" font-family="monospace">df.isnull().sum() reduced to 0 across all 14 feature columns.</text>
    <text x="20" y="235" fill="#cbd5e1" font-size="12" font-family="monospace">Categorical type-casting completed. Outliers clipped via IQR bounds [Q1-1.5*IQR, Q3+1.5*IQR].</text>
    <text x="20" y="255" fill="#38bdf8" font-size="12" font-family="monospace">Processed dataframe successfully exported to 'cleaned_dataset.csv'.</text>
  </g>

</svg>