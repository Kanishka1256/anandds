<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1630"/>
      <stop offset="100%" stop-color="#141d3d"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f63e6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="700" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="418" rx="15" fill="none" stroke="#25325a" stroke-width="1.5"/>
  
  <!-- Header bar -->
  <rect x="25" y="20" width="650" height="46" rx="8" fill="#182348" stroke="#2a3966"/>
  <circle cx="45" cy="43" r="5" fill="#f43f5e"/>
  <circle cx="62" cy="43" r="5" fill="#eab308"/>
  <circle cx="79" cy="43" r="5" fill="#10b981"/>
  <text x="100" y="48" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="600">Experiment 4: Feature Scaling & Encoding Analysis</text>
  <text x="655" y="48" text-anchor="end" fill="#8e98bd" font-family="monospace" font-size="12">DSLab · Output Verified</text>

  <!-- Content area -->
  
  <g transform="translate(50, 90)">
    <text x="0" y="15" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13" font-weight="600">Feature Scaling: Raw Data vs StandardScaler vs MinMaxScaler</text>
    
    <!-- Comparison 3 panels -->
    <g transform="translate(0, 40)">
      <!-- Panel 1 -->
      <rect x="0" y="0" width="180" height="190" rx="10" fill="#131c3b" stroke="#253563"/>
      <text x="90" y="25" fill="#f59e0b" font-weight="700" font-size="13" text-anchor="middle">Raw Data</text>
      <text x="90" y="45" fill="#94a3b8" font-size="11" text-anchor="middle">Scale: [1,000 – 150,000]</text>
      <!-- Unscaled skew bar -->
      <rect x="30" y="70" width="120" height="80" rx="4" fill="#f59e0b" fill-opacity="0.3"/>
      <path d="M 40 140 Q 60 75, 140 140" stroke="#f59e0b" stroke-width="2" fill="none"/>
      <text x="90" y="175" fill="#ef4444" font-size="10" text-anchor="middle">High Variance / Skew</text>

      <!-- Panel 2 -->
      <rect x="205" y="0" width="180" height="190" rx="10" fill="#131c3b" stroke="#253563"/>
      <text x="295" y="25" fill="#38bdf8" font-weight="700" font-size="13" text-anchor="middle">StandardScaler</text>
      <text x="295" y="45" fill="#94a3b8" font-size="11" text-anchor="middle">μ = 0, σ = 1</text>
      <!-- Bell curve centered -->
      <path d="M 230 140 Q 295 60, 360 140" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2"/>
      <line x1="295" y1="60" x2="295" y2="140" stroke="#38bdf8" stroke-dasharray="3,3"/>
      <text x="295" y="175" fill="#10b981" font-size="10" text-anchor="middle">Z-score Normalized</text>

      <!-- Panel 3 -->
      <rect x="410" y="0" width="180" height="190" rx="10" fill="#131c3b" stroke="#253563"/>
      <text x="500" y="25" fill="#a855f7" font-weight="700" font-size="13" text-anchor="middle">MinMaxScaler</text>
      <text x="500" y="45" fill="#94a3b8" font-size="11" text-anchor="middle">Bounds: [0.0, 1.0]</text>
      <rect x="435" y="80" width="130" height="60" rx="4" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
      <text x="500" y="175" fill="#10b981" font-size="10" text-anchor="middle">Bounded Unit Interval</text>
    </g>
    <text x="300" y="260" fill="#e2e8f0" font-size="12" text-anchor="middle">✓ Transformation preserved distribution shape while eliminating feature dominance</text>
  </g>

</svg>