<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1630"/>
      <stop offset="100%" stop-color="#141d3d"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f63e6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="700" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="418" rx="15" fill="none" stroke="#25325a" stroke-width="1.5"/>
  
  <!-- Header bar -->
  <rect x="25" y="20" width="650" height="46" rx="8" fill="#182348" stroke="#2a3966"/>
  <circle cx="45" cy="43" r="5" fill="#f43f5e"/>
  <circle cx="62" cy="43" r="5" fill="#eab308"/>
  <circle cx="79" cy="43" r="5" fill="#10b981"/>
  <text x="100" y="48" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="600">Experiment 10: Association Rules & Market Basket Analysis</text>
  <text x="655" y="48" text-anchor="end" fill="#8e98bd" font-family="monospace" font-size="12">DSLab · Output Verified</text>

  <!-- Content area -->
  
  <g transform="translate(50, 90)">
    <text x="0" y="15" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13" font-weight="600">Market Basket Analysis: Support, Confidence &amp; Lift Metrics</text>
    
    <!-- Table Layout -->
    <rect x="0" y="35" width="580" height="175" rx="8" fill="#131c3b" stroke="#253563"/>
    
    <!-- Header -->
    <rect x="0" y="35" width="580" height="32" rx="8" fill="#1e293b"/>
    <text x="20" y="56" fill="#94a3b8" font-size="11" font-weight="700">Rule (Antecedent → Consequent)</text>
    <text x="260" y="56" fill="#94a3b8" font-size="11" font-weight="700">Support</text>
    <text x="360" y="56" fill="#94a3b8" font-size="11" font-weight="700">Confidence</text>
    <text x="470" y="56" fill="#94a3b8" font-size="11" font-weight="700">Lift Ratio</text>

    <!-- Row 1 -->
    <text x="20" y="92" fill="#e2e8f0" font-size="12" font-family="monospace">{Bread, Butter} → {Milk}</text>
    <text x="260" y="92" fill="#38bdf8" font-size="12" font-family="monospace">0.245</text>
    <text x="360" y="92" fill="#4ade80" font-size="12" font-family="monospace">0.820 (82%)</text>
    <text x="470" y="92" fill="#facc15" font-weight="700" font-size="12" font-family="monospace">2.45 ★★★</text>

    <!-- Row 2 -->
    <line x1="0" y1="108" x2="580" y2="108" stroke="#253563"/>
    <text x="20" y="130" fill="#e2e8f0" font-size="12" font-family="monospace">{Diapers} → {Beer}</text>
    <text x="260" y="130" fill="#38bdf8" font-size="12" font-family="monospace">0.182</text>
    <text x="360" y="130" fill="#4ade80" font-size="12" font-family="monospace">0.745 (75%)</text>
    <text x="470" y="130" fill="#facc15" font-weight="700" font-size="12" font-family="monospace">3.12 ★★★</text>

    <!-- Row 3 -->
    <line x1="0" y1="145" x2="580" y2="145" stroke="#253563"/>
    <text x="20" y="167" fill="#e2e8f0" font-size="12" font-family="monospace">{Coffee} → {Sugar}</text>
    <text x="260" y="167" fill="#38bdf8" font-size="12" font-family="monospace">0.310</text>
    <text x="360" y="167" fill="#4ade80" font-size="12" font-family="monospace">0.890 (89%)</text>
    <text x="470" y="167" fill="#facc15" font-weight="700" font-size="12" font-family="monospace">2.18 ★★</text>

    <!-- Row 4 -->
    <line x1="0" y1="180" x2="580" y2="180" stroke="#253563"/>
    <text x="20" y="200" fill="#e2e8f0" font-size="12" font-family="monospace">{Laptop Bag} → {Mouse}</text>
    <text x="260" y="200" fill="#38bdf8" font-size="12" font-family="monospace">0.155</text>
    <text x="360" y="200" fill="#4ade80" font-size="12" font-family="monospace">0.680 (68%)</text>
    <text x="470" y="200" fill="#facc15" font-weight="700" font-size="12" font-family="monospace">2.84 ★★★</text>

    <text x="290" y="245" fill="#e2e8f0" font-size="12" text-anchor="middle">✓ Minimum Support: 0.15 | Minimum Confidence: 0.60 | Generated 14 High-Lift Rules</text>
  </g>

</svg>