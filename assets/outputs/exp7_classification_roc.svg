<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1630"/>
      <stop offset="100%" stop-color="#141d3d"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f63e6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="700" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="418" rx="15" fill="none" stroke="#25325a" stroke-width="1.5"/>
  
  <!-- Header bar -->
  <rect x="25" y="20" width="650" height="46" rx="8" fill="#182348" stroke="#2a3966"/>
  <circle cx="45" cy="43" r="5" fill="#f43f5e"/>
  <circle cx="62" cy="43" r="5" fill="#eab308"/>
  <circle cx="79" cy="43" r="5" fill="#10b981"/>
  <text x="100" y="48" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="600">Experiment 7: Logistic Regression Classification & ROC-AUC</text>
  <text x="655" y="48" text-anchor="end" fill="#8e98bd" font-family="monospace" font-size="12">DSLab · Output Verified</text>

  <!-- Content area -->
  
  <g transform="translate(50, 90)">
    <text x="0" y="15" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13" font-weight="600">Receiver Operating Characteristic (ROC) &amp; Confusion Matrix</text>
    
    <!-- ROC Curve chart -->
    <g transform="translate(10, 30)">
      <line x1="30" y1="180" x2="250" y2="180" stroke="#334155" stroke-width="2"/>
      <line x1="30" y1="10" x2="30" y2="180" stroke="#334155" stroke-width="2"/>
      <!-- Diagonal random chance -->
      <line x1="30" y1="180" x2="250" y2="10" stroke="#64748b" stroke-dasharray="4,4"/>
      <!-- ROC curve -->
      <path d="M 30 180 Q 40 25, 250 10" fill="url(#accGrad)" fill-opacity="0.25" stroke="#38bdf8" stroke-width="3"/>
      <text x="140" y="205" fill="#94a3b8" font-size="10" text-anchor="middle">False Positive Rate (FPR)</text>
      <text x="10" y="95" fill="#94a3b8" font-size="10" transform="rotate(-90 10 95)" text-anchor="middle">True Positive Rate (TPR)</text>
      <text x="140" y="110" fill="#38bdf8" font-weight="700" font-size="12">AUC = 0.941</text>
    </g>

    <!-- Confusion Matrix on Right -->
    <g transform="translate(320, 30)">
      <text x="120" y="10" fill="#94a3b8" font-size="11" text-anchor="middle">Confusion Matrix</text>
      <rect x="30" y="25" width="85" height="65" rx="6" fill="#10b981" fill-opacity="0.85"/>
      <text x="72" y="55" fill="#fff" font-weight="700" font-size="14" text-anchor="middle">TP: 842</text>
      <text x="72" y="73" fill="#d1fae5" font-size="10" text-anchor="middle">Actual + / Pred +</text>

      <rect x="125" y="25" width="85" height="65" rx="6" fill="#ef4444" fill-opacity="0.5"/>
      <text x="167" y="55" fill="#fff" font-weight="700" font-size="14" text-anchor="middle">FP: 38</text>
      <text x="167" y="73" fill="#fee2e2" font-size="10" text-anchor="middle">Actual - / Pred +</text>

      <rect x="30" y="95" width="85" height="65" rx="6" fill="#ef4444" fill-opacity="0.5"/>
      <text x="72" y="125" fill="#fff" font-weight="700" font-size="14" text-anchor="middle">FN: 44</text>
      <text x="72" y="143" fill="#fee2e2" font-size="10" text-anchor="middle">Actual + / Pred -</text>

      <rect x="125" y="95" width="85" height="65" rx="6" fill="#10b981" fill-opacity="0.85"/>
      <text x="167" y="125" fill="#fff" font-weight="700" font-size="14" text-anchor="middle">TN: 916</text>
      <text x="167" y="143" fill="#d1fae5" font-size="10" text-anchor="middle">Actual - / Pred -</text>

      <text x="120" y="185" fill="#4ade80" font-weight="700" font-size="12" text-anchor="middle">Overall Accuracy: 95.54%</text>
    </g>
  </g>

</svg>