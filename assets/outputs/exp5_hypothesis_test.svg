<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1630"/>
      <stop offset="100%" stop-color="#141d3d"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f63e6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="700" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="418" rx="15" fill="none" stroke="#25325a" stroke-width="1.5"/>
  
  <!-- Header bar -->
  <rect x="25" y="20" width="650" height="46" rx="8" fill="#182348" stroke="#2a3966"/>
  <circle cx="45" cy="43" r="5" fill="#f43f5e"/>
  <circle cx="62" cy="43" r="5" fill="#eab308"/>
  <circle cx="79" cy="43" r="5" fill="#10b981"/>
  <text x="100" y="48" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="600">Experiment 5: Two-Sample Hypothesis Testing & P-Value Curve</text>
  <text x="655" y="48" text-anchor="end" fill="#8e98bd" font-family="monospace" font-size="12">DSLab · Output Verified</text>

  <!-- Content area -->
  
  <g transform="translate(50, 90)">
    <text x="0" y="15" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13" font-weight="600">Student's Two-Sample t-Test (Alpha α = 0.05)</text>
    
    <!-- Curve -->
    <path d="M 30 200 Q 140 195, 230 140 T 300 30 T 370 140 T 570 200" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
    <line x1="30" y1="200" x2="570" y2="200" stroke="#334155" stroke-width="2"/>

    <!-- Critical regions (Rejection zones) -->
    <path d="M 450 160 Q 510 190, 570 200 L 450 200 Z" fill="#ef4444" fill-opacity="0.6"/>
    <path d="M 30 200 Q 90 190, 150 160 L 150 200 Z" fill="#ef4444" fill-opacity="0.6"/>

    <!-- Calculated t-stat line -->
    <line x1="470" y1="40" x2="470" y2="200" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4"/>
    <circle cx="470" cy="40" r="5" fill="#f59e0b"/>
    <text x="475" y="35" fill="#f59e0b" font-weight="700" font-size="11">t-stat = 2.41 (In Rejection Zone)</text>

    <!-- Metrics Card -->
    <rect x="70" y="50" width="180" height="90" rx="8" fill="#131c3b" stroke="#253563"/>
    <text x="85" y="75" fill="#38bdf8" font-size="12" font-weight="700">Test Outcome:</text>
    <text x="85" y="98" fill="#cbd5e1" font-size="11">p-value = 0.0178 &lt; 0.05</text>
    <text x="85" y="120" fill="#f87171" font-size="11" font-weight="700">Reject Null Hypothesis (H₀)</text>

    <text x="300" y="245" fill="#10b981" font-size="12" font-weight="600" text-anchor="middle">✓ Statistically significant difference confirmed between treatment &amp; control cohorts</text>
  </g>

</svg>