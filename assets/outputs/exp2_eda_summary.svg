<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1630"/>
      <stop offset="100%" stop-color="#141d3d"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f63e6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="700" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="698" height="418" rx="15" fill="none" stroke="#25325a" stroke-width="1.5"/>
  
  <!-- Header bar -->
  <rect x="25" y="20" width="650" height="46" rx="8" fill="#182348" stroke="#2a3966"/>
  <circle cx="45" cy="43" r="5" fill="#f43f5e"/>
  <circle cx="62" cy="43" r="5" fill="#eab308"/>
  <circle cx="79" cy="43" r="5" fill="#10b981"/>
  <text x="100" y="48" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="14" font-weight="600">Experiment 2: Exploratory Data Analysis & Correlation Matrix</text>
  <text x="655" y="48" text-anchor="end" fill="#8e98bd" font-family="monospace" font-size="12">DSLab · Output Verified</text>

  <!-- Content area -->
  
  <g transform="translate(50, 85)">
    <text x="0" y="15" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13" font-weight="600">Feature Correlation Heatmap &amp; Distribution Metrics</text>
    
    <!-- Matrix grid -->
    <g transform="translate(10, 35)">
      <!-- Labels top -->
      <text x="65" y="-10" fill="#94a3b8" font-size="11" text-anchor="middle">Age</text>
      <text x="145" y="-10" fill="#94a3b8" font-size="11" text-anchor="middle">Income</text>
      <text x="225" y="-10" fill="#94a3b8" font-size="11" text-anchor="middle">Score</text>
      <text x="305" y="-10" fill="#94a3b8" font-size="11" text-anchor="middle">Exp</text>

      <!-- Row 1 -->
      <text x="-15" y="45" fill="#94a3b8" font-size="11" text-anchor="end">Age</text>
      <rect x="25" y="10" width="80" height="55" rx="6" fill="#3b82f6" fill-opacity="0.9"/>
      <text x="65" y="43" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">1.00</text>
      <rect x="105" y="10" width="80" height="55" rx="6" fill="#38bdf8" fill-opacity="0.75"/>
      <text x="145" y="43" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">0.78</text>
      <rect x="185" y="10" width="80" height="55" rx="6" fill="#f43f5e" fill-opacity="0.5"/>
      <text x="225" y="43" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">-0.32</text>
      <rect x="265" y="10" width="80" height="55" rx="6" fill="#3b82f6" fill-opacity="0.85"/>
      <text x="305" y="43" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">0.89</text>

      <!-- Row 2 -->
      <text x="-15" y="105" fill="#94a3b8" font-size="11" text-anchor="end">Income</text>
      <rect x="25" y="70" width="80" height="55" rx="6" fill="#38bdf8" fill-opacity="0.75"/>
      <text x="65" y="103" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">0.78</text>
      <rect x="105" y="70" width="80" height="55" rx="6" fill="#3b82f6" fill-opacity="0.9"/>
      <text x="145" y="103" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">1.00</text>
      <rect x="185" y="70" width="80" height="55" rx="6" fill="#f43f5e" fill-opacity="0.3"/>
      <text x="225" y="103" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">-0.19</text>
      <rect x="265" y="70" width="80" height="55" rx="6" fill="#3b82f6" fill-opacity="0.8"/>
      <text x="305" y="103" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">0.84</text>

      <!-- Row 3 -->
      <text x="-15" y="165" fill="#94a3b8" font-size="11" text-anchor="end">Score</text>
      <rect x="25" y="130" width="80" height="55" rx="6" fill="#f43f5e" fill-opacity="0.5"/>
      <text x="65" y="163" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">-0.32</text>
      <rect x="105" y="130" width="80" height="55" rx="6" fill="#f43f5e" fill-opacity="0.3"/>
      <text x="145" y="163" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">-0.19</text>
      <rect x="185" y="130" width="80" height="55" rx="6" fill="#3b82f6" fill-opacity="0.9"/>
      <text x="225" y="163" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">1.00</text>
      <rect x="265" y="130" width="80" height="55" rx="6" fill="#f43f5e" fill-opacity="0.4"/>
      <text x="305" y="163" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">-0.28</text>
    </g>

    <!-- Statistical Callout Box -->
    <rect x="380" y="35" width="220" height="230" rx="10" fill="#131c3b" stroke="#253563"/>
    <text x="395" y="65" fill="#38bdf8" font-size="13" font-weight="700">Descriptive Stats:</text>
    <text x="395" y="95" fill="#cbd5e1" font-size="12">Mean Income: $78,420</text>
    <text x="395" y="120" fill="#cbd5e1" font-size="12">Median Score: 68.5</text>
    <text x="395" y="145" fill="#cbd5e1" font-size="12">Skewness: 0.24 (Normal)</text>
    <text x="395" y="170" fill="#cbd5e1" font-size="12">Kurtosis: 2.94</text>
    <text x="395" y="200" fill="#10b981" font-size="11" font-weight="600">✓ Strong Pearson corr (0.89)</text>
    <text x="395" y="220" fill="#10b981" font-size="11" font-weight="600">between Age &amp; Experience.</text>
  </g>

</svg>